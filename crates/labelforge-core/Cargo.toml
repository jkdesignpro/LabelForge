[package]
name = "labelforge-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "LabelForge label model, barcode encoding, serial patterns and rendering"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
resvg = "0.45"
svg2pdf = "0.13"
pdf-writer = "0.12"

[build-dependencies]
cc = "1"
